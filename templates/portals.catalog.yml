# Company catalog for the CareerOps portal scanner (exported by scripts/export-catalog.mjs).
# Shared list of employers with tested scan settings. It is not a personal configuration:
# pick the companies that fit your search and build your own portals.yml with
#   node scripts/build-portals.mjs --select <names.txt>
# status: ok = scanned by the provider; browser = the site blocks scripted requests, read it in a
# browser; broken = disabled, left here for reference.
keyword_search:
  min_total: 400
  terms:
    - intern
    - internship
    - co-op
    - student
    - summer analyst
    - summer associate
    - graduate program
    - early career
  providers:
    workday:
      terms:
        - intern
        - internship
        - student
        - summer analyst
        - summer associate
        - early career
  facet_values:
    - intern
    - internship
    - co-op
    - coop
    - student
    - graduate
    - early career
    - early talent
    - campus
    - university
